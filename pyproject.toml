[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "or-trace"
version = "0.3.0"
description = "Explainable financial transaction lineage service"
requires-python = ">=3.9"
# Keep schema generators identical across Python versions for the versioned OpenAPI.
dependencies = ["fastapi==0.128.8", "pydantic==2.13.5", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
